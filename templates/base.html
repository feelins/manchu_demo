<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}通化师范学院 · {{ site.platform_name }}{% endblock %}</title>

<!-- 设计令牌 + 门户基础样式（全站共用） -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/design-token.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

<!-- 满文字体：内嵌字库（woff2 base64），不依赖额外的字体请求 -->
<!-- 全站生效：所有页面模板都继承本文件，无需在每个页面重复引入 -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/manju-font.css') }}">

{% block extra_css %}{% endblock %}
</head>
<body>

{% include "partials/header.html" %}

<main id="main">
{% block content %}{% endblock %}
</main>

{% include "partials/footer.html" %}

{% block extra_js %}{% endblock %}
</body>
</html>
